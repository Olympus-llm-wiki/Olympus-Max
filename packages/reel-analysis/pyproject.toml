[project]
name = "gemini-reel-analysis"
version = "0.1.0"
description = "Portable Gemini video analysis and bounded concurrent review"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "mcp==2.2.0", "pydantic==2.13.5", "starlette==1.6.0", "uvicorn==0.52.4"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
reel = "reel_analysis.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
